name: Verify maintained workflows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: python -m pip install numpy==2.4.4 pandas==3.0.2 scipy==1.17.1 scikit-learn==1.8.0 matplotlib==3.10.8 openpyxl==3.1.5 ruff==0.16.6
      - name: Check all maintained Python modules
        run: ruff check src utils tests web-demo/tabpfn_service.py
      - name: Run all unit tests without private data or checkpoints
        run: python -m unittest discover -s tests -v
      - name: Exercise synthetic five-fold end-to-end workflow
        run: python -m src system demo --out-dir results/ci-system-demo
      - name: Compile project modules
        run: python -m compileall -q src utils tests
